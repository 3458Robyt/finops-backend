services:
  api:
    build: .
    env_file: .env
    environment:
      APP_PROCESS_ROLE: api
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_PROCESS_ROLE: worker
      INGESTION_WORKER_ENABLED: "true"
      AGENT_LEARNING_WORKER_ENABLED: "true"
      RECOMMENDATION_ANALYSIS_WORKER_ENABLED: "true"
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      APP_PROCESS_ROLE: scheduler
      INGESTION_SCHEDULER_ENABLED: "true"
      RECOMMENDATION_ANALYSIS_SCHEDULER_ENABLED: "true"
      MESSAGE_SCHEDULER_ENABLED: "true"
    restart: unless-stopped
