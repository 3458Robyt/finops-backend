services:
  api:
    build: .
    env_file: .env
    environment:
      APP_PROCESS_ROLE: api
    init: true
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_PROCESS_ROLE: worker
      INGESTION_WORKER_ENABLED: "true"
      AGENT_LEARNING_WORKER_ENABLED: "true"
      RECOMMENDATION_ANALYSIS_WORKER_ENABLED: "true"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      APP_PROCESS_ROLE: scheduler
      INGESTION_SCHEDULER_ENABLED: "true"
      RECOMMENDATION_ANALYSIS_SCHEDULER_ENABLED: "true"
      MESSAGE_SCHEDULER_ENABLED: "true"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    restart: unless-stopped
